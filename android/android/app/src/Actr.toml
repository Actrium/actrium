edition = 1
exports = []

[package]
name = "actro"
description = "Actro browser client app"
authors = ["Actro-Team"]
license = "Apache-2.0"
tags = ["dev", "client"]

[package.actr_type]
publisher = "actro"
name = "actro"

[dependencies]
bot = { actr_type = "actro+app_server" }

[system.signaling]
url = "wss://actrix1.actro.chat:443/signaling/ws"

[system.deployment]
realm_id = 573

[system.discovery]
visible = true

[system.observability]
filter_level = "debug"
tracing_enabled = true
tracing_endpoint = "http://127.0.0.1:4317"
tracing_service_name = "actro"

[system.webrtc]
force_relay = false
stun_urls = ["stun:actrix1.actro.chat:3479"]
turn_urls = ["turn:actrix1.actro.chat:3479"]

[scripts]
dev = "xcodegen generate"
test = "xcodebuild test"

[acl]

[[acl.rules]]
permission = "allow"
types = ["actro+app_server"]
