edition = 1
exports = []

[package]
name = "actrium"
description = "Actrium browser client app"
authors = ["Actrium-Team"]
license = "Apache-2.0"
tags = ["dev", "client"]

[package.actr_type]
publisher = "actrium"
name = "actrium"

[dependencies]
bot = { actr_type = "actrium+app_server" }

[system.signaling]
url = "wss://loran.example.com:443/signaling/ws"

[system.deployment]
realm = "actrium@example.com"

[system.discovery]
visible = true

[system.observability]
filter_level = "debug"
tracing_enabled = true
tracing_endpoint = "http://127.0.0.1:4317"
tracing_service_name = "actrium"

[system.webrtc]
force_relay = false
stun_urls = ["stun:loran.example.com:3479"]
turn_urls = ["turn:loran.example.com:3479"]

[scripts]
dev = "xcodegen generate"
test = "xcodebuild test"

[acl]

[[acl.rules]]
permission = "allow"
types = ["actrium+app_server"]
