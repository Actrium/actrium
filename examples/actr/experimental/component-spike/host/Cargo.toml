[package]
name = "spike-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

# Mark as an independent workspace so the repo-root workspace does not absorb this crate.
[workspace]

[dependencies]
# Match the patched Component Model runtime used by the main workspace.
wasmtime = { version = "=48.0.8", features = ["component-model", "runtime", "cranelift"] }
wasmtime-wasi = "=48.0.8"
anyhow = "1"

[profile.release]
opt-level = 3
