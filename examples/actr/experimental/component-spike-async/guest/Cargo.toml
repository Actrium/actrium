[package]
name = "spike-guest-async"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

# Mark as an independent workspace so the repo-root workspace does not absorb this crate.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Match the explicit async function types in the WIT contract.
wit-bindgen = "=0.59.0"

[profile.release]
opt-level = "s"
lto = true
strip = false
codegen-units = 1
