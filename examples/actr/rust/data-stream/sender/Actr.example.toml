edition = 1

[signaling]
url = "ws://localhost:8081/signaling/ws"

[issuer_endpoint]
url = "http://localhost:8081/issuer"

[deployment]
realm = "data-stream@example.com"
# Written by `actr realm join` (the start script runs it).
realm_client_key = "realm-client.json"

[discovery]
visible = true

[webrtc]
force_relay = false
stun_urls = ["stun:localhost:3478"]
turn_urls = ["turn:localhost:3478"]

# ACL configuration - allow file transfer receiver

[acl]

[[acl.rules]]
permission = "allow"
# Allow server with actr_type = "acme/FileTransferService@1.0.0"
type = "acme/FileTransferService@1.0.0"

[scripts]
dev = "cargo run"
test = "cargo test"
