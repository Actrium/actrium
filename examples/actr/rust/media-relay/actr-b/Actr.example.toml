edition = 1

[signaling]
url = "ws://localhost:8081/signaling/ws"

[issuer_endpoint]
url = "http://localhost:8081/issuer"

[deployment]
realm = "media-relay@example.com"
# Written by `actr realm join` (the start script runs it).
realm_client_key = "realm-client.json"

[discovery]
visible = true

# ACL configuration - allow actr-a relay client to communicate with us
# This is BIDIRECTIONAL: we allow RelayClient to relay TO us

[acl]

[[acl.rules]]
permission = "allow"
# Allow RelayClient to send signaling/data to us (RelayService)
type = "actr-example/RelayClient@1.0.0"

[scripts]
dev = "cargo run"
test = "cargo test"
