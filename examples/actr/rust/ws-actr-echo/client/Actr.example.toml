edition = 1

[signaling]
url = "ws://localhost:8081/signaling/ws"

[issuer_endpoint]
url = "http://localhost:8081/issuer"

[deployment]
realm = "ws-echo@example.com"

[discovery]
visible = true

[observability]
filter_level = "info"
tracing_enabled = false
tracing_endpoint = "http://localhost:4317"
tracing_service_name = "ws-echo-client-app"

# Both peers connect outbound to the automatically discovered Loran relay.

# ACL configuration - allow responses from the WsEchoService server

[acl]

[[acl.rules]]
permission = "allow"
type = "acme/WsEchoService@1.0.0"

[scripts]
dev = "cargo run"
test = "cargo test"
