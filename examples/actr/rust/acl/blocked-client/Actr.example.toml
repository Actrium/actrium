edition = 1

[signaling]
url = "ws://localhost:8081/signaling/ws"

[issuer_endpoint]
url = "http://localhost:8081/issuer"

[deployment]
realm = "acl-demo@example.com"
# Written by `actr realm join` (the start script runs it).
realm_client_key = "realm-client.json"

[discovery]
visible = true

[webrtc]
force_relay = false
stun_urls = ["stun:localhost:3478"]
turn_urls = ["turn:localhost:3478"]

# ACL configuration - this client tries to connect to greeter server
# but the server's ACL doesn't allow this type

[acl]

[[acl.rules]]
permission = "allow"
type = "acme:greeter.GreeterService:1.0.0"

[scripts]
dev = "cargo run"
test = "cargo test"
