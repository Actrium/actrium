edition = 1

[signaling]
url = "ws://localhost:8081/signaling/ws"

[issuer_endpoint]
url = "http://localhost:8081/issuer"

[deployment]
realm = "mutil-actr@example.com"
# Written by `actr realm join` (the start script runs it).
realm_client_key = "realm-client.json"

[discovery]
visible = true

[tracing]
enabled = true
endpoint = "http://localhost:4317"
service_name = "echo-real-client-app"

# ACL configuration - allow echo server

[acl]

[[acl.rules]]
permission = "allow"
# Allow server with actr_type = "acme/EchoService@1.0.0"
type = "acme/EchoService@1.0.0"

[scripts]
dev = "cargo run"
test = "cargo test"
