<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Actro</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --surface: #ffffff;
      --surface-2: #eef0f3;
      --text: #202124;
      --muted: #5f6368;
      --line: #dfe1e5;
      --accent: #1a73e8;
      --accent-soft: #d3e3fd;
      --accent-text: #0b57d0;
      --danger: #b3261e;
      --shadow: 0 1px 2px rgba(60,64,67,.12), 0 1px 3px rgba(60,64,67,.08);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #202124;
      --surface: #292a2d;
      --surface-2: #303134;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --line: #3c4043;
      --accent: #8ab4f8;
      --accent-soft: #394457;
      --accent-text: #aecbfa;
      --danger: #f28b82;
      --shadow: 0 1px 2px rgba(0,0,0,.28), 0 1px 4px rgba(0,0,0,.2);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: default; }
    .shell {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      height: 100%;
      min-width: 640px;
    }
    .sidebar {
      min-width: 0;
      border-right: 1px solid var(--line);
      background: var(--bg);
      overflow: auto;
      padding: 24px 12px 30px 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 48px;
      padding: 0 22px 18px 28px;
      font-size: 23px;
      font-weight: 600;
      letter-spacing: -.3px;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 2px solid currentColor;
      border-radius: 50%;
      font-size: 16px;
      font-weight: 700;
    }
    .nav-section { padding: 6px 0; }
    .nav-divider { height: 1px; background: var(--line); margin: 10px 16px 10px 0; }
    .nav-item {
      width: 100%;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 18px 0 30px;
      border: 0;
      border-radius: 0 22px 22px 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      font-weight: 500;
    }
    .nav-item:hover { background: color-mix(in srgb, var(--surface-2) 72%, transparent); }
    .nav-item.selected {
      background: var(--accent-soft);
      color: var(--accent-text);
    }
    .nav-icon {
      width: 22px;
      flex: 0 0 22px;
      color: var(--muted);
      font-size: 18px;
      text-align: center;
    }
    .nav-item.selected .nav-icon { color: var(--accent-text); }
    .main {
      min-width: 0;
      height: 100%;
      overflow: auto;
      background: var(--bg);
    }
    .main-inner {
      width: min(1120px, calc(100% - 64px));
      min-width: 420px;
      margin: 0 auto;
      padding: 24px 0 64px;
    }
    .topbar {
      position: sticky;
      z-index: 5;
      top: 0;
      padding: 0 0 24px;
      background: linear-gradient(var(--bg) 76%, transparent);
    }
    .search {
      position: relative;
      width: min(760px, 100%);
      margin: 0 auto;
    }
    .search::before {
      content: "⌕";
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-54%);
      color: var(--muted);
      font-size: 24px;
      pointer-events: none;
    }
    .search input {
      width: 100%;
      height: 48px;
      padding: 0 52px;
      border: 1px solid transparent;
      border-radius: 24px;
      outline: none;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    h1 { margin: 4px 0 24px; font-size: 22px; font-weight: 600; }
    h2 { margin: 28px 0 14px; font-size: 16px; font-weight: 600; }
    .card {
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .row {
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 18px;
      border-top: 1px solid var(--line);
    }
    .row:first-child { border-top: 0; }
    .row.clickable:hover { background: var(--surface-2); }
    .row-main { min-width: 0; flex: 1; }
    .row-title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 500; }
    .row-subtitle { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); font-size: 12px; }
    .row-meta { flex: 0 0 auto; color: var(--muted); font-variant-numeric: tabular-nums; }
    .favicon {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      flex: 0 0 24px;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .button {
      min-height: 34px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: transparent;
      color: var(--accent-text);
      font-weight: 600;
    }
    .button:hover { background: var(--surface-2); }
    .button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    :root[data-theme="dark"] .button.primary { color: #202124; }
    .button.danger { color: var(--danger); }
    .icon-button {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 19px;
    }
    .icon-button:hover { background: var(--surface-2); color: var(--text); }
    .select, .text-field {
      height: 36px;
      min-width: 180px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 11px;
      outline: none;
      background: var(--surface-2);
    }
    .text-field:focus, .select:focus { border-color: var(--accent); }
    .segmented { display: flex; gap: 10px; flex-wrap: wrap; }
    .choice {
      min-width: 130px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: transparent;
      text-align: left;
    }
    .choice.selected { border: 2px solid var(--accent); padding: 15px; color: var(--accent-text); }
    .choice strong { display: block; margin-bottom: 3px; }
    .chrome-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .chrome-choice {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      align-items: center;
      gap: 11px;
      min-width: 0;
      min-height: 76px;
      padding: 12px;
      cursor: default;
    }
    .chrome-choice.selected { padding: 11px; }
    .chrome-preview {
      display: block;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255,255,255,.46);
      border-radius: 9px;
      background:
        radial-gradient(circle at 18% 4%, rgba(255,255,255,.72), transparent 46%),
        linear-gradient(145deg, rgba(255,255,255,.42), rgba(255,255,255,.04)),
        var(--chrome-color);
      box-shadow: inset 0 1px rgba(255,255,255,.46), inset 0 -1px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.12);
      backdrop-filter: blur(14px) saturate(1.25);
    }
    .chrome-copy {
      display: block;
      color: var(--text);
      text-align: left;
    }
    .chrome-choice.selected .chrome-copy strong { color: var(--accent-text); }
    .form-stack { display: grid; gap: 12px; padding: 18px; }
    .form-stack .text-field { width: 100%; }
    .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .switch { position: relative; width: 42px; height: 24px; flex: 0 0 42px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch span { position: absolute; inset: 0; border-radius: 14px; background: var(--line); }
    .switch span::after { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: transform .14s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(18px); }
    .checkbox { display: flex; align-items: center; gap: 8px; }
    .empty { padding: 72px 28px; text-align: center; color: var(--muted); }
    .empty-icon { margin-bottom: 12px; font-size: 34px; }
    .group-title { margin: 28px 0 12px; font-size: 16px; font-weight: 600; }
    .history-row .check { width: 18px; height: 18px; accent-color: var(--accent); }
    .history-row .row-meta { width: 76px; }
    .tag { display: inline-block; margin-left: 6px; padding: 2px 7px; border-radius: 9px; background: var(--surface-2); color: var(--muted); font-size: 11px; }
    .shortcut-key { min-width: 76px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-2); text-align: center; font-variant-numeric: tabular-nums; }
    .shortcut-key.recording { border-color: var(--accent); color: var(--accent-text); }
    .notice { padding: 12px 16px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-text); }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 100;
      transform: translate(-50%, 18px);
      opacity: 0;
      max-width: 520px;
      padding: 11px 18px;
      border-radius: 8px;
      background: var(--text);
      color: var(--bg);
      box-shadow: 0 4px 16px rgba(0,0,0,.28);
      transition: .18s ease;
      pointer-events: none;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .toast.error { background: var(--danger); color: #fff; }
    [hidden] { display: none !important; }
    @media (max-width: 820px) {
      .shell { grid-template-columns: 220px minmax(0,1fr); }
      .main-inner { width: calc(100% - 36px); }
      .nav-item { padding-left: 20px; }
      .brand { padding-left: 18px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast"></div>
  <script>
    (() => {
      "use strict";
      let state = { page: "settings", route: "actro://settings", theme: "dark", settings: {}, history: [], bookmarks: [] };
      let query = "";
      let bookmarkFolder = "all";
      let recordingShortcut = null;
      const app = document.getElementById("app");
      const toast = document.getElementById("toast");

      const post = payload => window.webkit?.messageHandlers?.actroInternal?.postMessage(payload);
      const decode = base64 => JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(base64), c => c.charCodeAt(0))));
      const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
      const domain = value => { try { return new URL(value).hostname || value; } catch { return value; } };
      const initial = title => (String(title || "?").trim()[0] || "?").toUpperCase();
      const nav = (id, icon, label, selected, url) => `<button class="nav-item ${selected ? "selected" : ""}" data-route="${esc(url)}"><span class="nav-icon">${icon}</span><span>${esc(label)}</span></button>`;
      const shell = (title, sidebar, content, placeholder) => `
        <div class="shell">
          <aside class="sidebar"><div class="brand"><span class="brand-mark">A</span><span>${esc(title)}</span></div>${sidebar}</aside>
          <main class="main"><div class="main-inner">
            <div class="topbar"><label class="search"><input id="page-search" value="${esc(query)}" placeholder="${esc(placeholder)}" autocomplete="off"></label></div>
            <div id="page-content">${content}</div>
          </div></main>
        </div>`;

      function settingsSection() {
        const path = state.route.replace(/^actro:\/\/settings\/?/i, "").split("/")[0] || "general";
        const items = [
          ["general", "⌕", "Search engine"], ["appearance", "◐", "Appearance"],
          ["password", "⚿", "Autofill and passwords"], ["privacy", "◇", "Privacy and security"],
          ["sync", "↻", "Sync"], ["shortcuts", "⌨", "Shortcuts"]
        ];
        const sidebar = `<div class="nav-section">${items.map(([id, icon, label]) => nav(id, icon, label, path === id, id === "general" ? "actro://settings" : `actro://settings/${id}`)).join("")}</div>`;
        const sections = {
          general: renderGeneral,
          appearance: renderAppearance,
          password: renderPassword,
          privacy: renderPrivacy,
          sync: renderSync,
          shortcuts: renderShortcuts,
        };
        return shell("Settings", sidebar, (sections[path] || renderGeneral)(), "Search settings");
      }

      function renderGeneral() {
        const s = state.settings || {};
        return `<h1>Search engine</h1><h2>Search</h2><div class="card"><div class="row"><div class="row-main"><div class="row-title">Default search engine</div><div class="row-subtitle">Used for searches from the address bar</div></div><select id="search-engine" class="select">${(s.searchEngines || []).map(e => `<option value="${esc(e.id)}" ${e.id === s.searchEngine ? "selected" : ""}>${esc(e.name)}</option>`).join("")}</select></div></div>`;
      }

      function renderAppearance() {
        const settings = state.settings || {};
        const mode = settings.appearance || "system";
        const choice = (id, title, subtitle) => `<button class="choice ${mode === id ? "selected" : ""}" data-appearance="${id}"><strong>${title}</strong><span class="row-subtitle">${subtitle}</span></button>`;
        const chrome = (settings.windowChromeOptions || []).map(option => `<button class="choice chrome-choice ${settings.windowChrome === option.id ? "selected" : ""}" data-window-chrome="${esc(option.id)}" style="--chrome-color:${esc(option.color)}"><span class="chrome-preview"></span><span class="chrome-copy"><strong>${esc(option.name)}</strong><span class="row-subtitle">${esc(option.subtitle)}</span></span></button>`).join("");
        return `<h1>Appearance</h1><h2>Mode</h2><div class="card"><div class="form-stack"><div class="segmented">${choice("system", "Follow system", "Match macOS appearance")}${choice("light", "Light", "Always use light colors")}${choice("dark", "Dark", "Always use dark colors")}</div></div></div><h2>Window color</h2><div class="card"><div class="form-stack"><div class="row-subtitle">The outer frame and Header use one shared translucent glass material.</div><div class="chrome-grid">${chrome}</div></div></div>`;
      }

      function renderPassword() {
        const v = state.settings?.vault || {};
        if (v.state === "notSetup") {
          return `<h1>Autofill and passwords</h1><h2>Password manager</h2><div class="card"><form id="vault-setup" class="form-stack"><div class="row-title">Create a password vault</div><div class="row-subtitle">Your passwords are encrypted locally with a master password.</div><input class="text-field" name="password" type="password" placeholder="Master password" required minlength="5"><input class="text-field" name="confirm" type="password" placeholder="Confirm password" required minlength="5"><input class="text-field" name="hint" placeholder="Password hint (optional)"><div class="actions"><button class="button primary" type="submit">Create vault</button></div></form></div>`;
        }
        if (v.state === "locked") {
          return `<h1>Autofill and passwords</h1><h2>Password manager</h2><div class="card"><form id="vault-unlock" class="form-stack"><div class="row-title">Vault locked</div>${v.hint ? `<div class="notice">Hint: ${esc(v.hint)}</div>` : ""}<input class="text-field" name="password" type="password" placeholder="Master password" required><div class="actions"><button class="button primary" type="submit">Unlock</button>${v.biometricsAvailable && v.touchIDEnabled ? `<button id="vault-biometric" class="button" type="button">Use Touch ID</button>` : ""}</div></form></div>`;
        }
        const items = (v.items || []).map(item => `<div class="row"><span class="favicon">${esc(initial(item.title))}</span><div class="row-main"><div class="row-title">${esc(item.title)}</div><div class="row-subtitle">${esc(item.category)}${item.subtitle ? ` · ${esc(item.subtitle)}` : ""}</div></div></div>`).join("");
        return `<h1>Autofill and passwords</h1><div class="actions" style="justify-content:flex-end;margin-bottom:14px"><button id="vault-lock" class="button">Lock</button><button id="vault-reset" class="button danger">Reset vault</button></div><div class="card">${items || `<div class="empty"><div class="empty-icon">⚿</div>No saved passwords yet</div>`}</div>`;
      }

      function renderPrivacy() {
        const enabled = !!state.settings?.contentBlocking;
        return `<h1>Privacy and security</h1><h2>Protection</h2><div class="card"><div class="row"><div class="row-main"><div class="row-title">Block ads and trackers</div><div class="row-subtitle">Applies to newly opened tabs</div></div><label class="switch"><input id="content-blocking" type="checkbox" ${enabled ? "checked" : ""}><span></span></label></div></div><h2>Clear browsing data</h2><div class="card"><div class="form-stack"><select id="clear-range" class="select"><option value="hour">Last hour</option><option value="day">Last 24 hours</option><option value="all" selected>All time</option></select><label class="checkbox"><input data-clear-type="cookies" type="checkbox" checked> Cookies</label><label class="checkbox"><input data-clear-type="cache" type="checkbox" checked> Cached files</label><label class="checkbox"><input data-clear-type="localStorage" type="checkbox"> Local storage</label><label class="checkbox"><input data-clear-type="indexedDB" type="checkbox"> IndexedDB</label><div class="actions"><button id="clear-data" class="button primary">Clear data</button></div></div></div>`;
      }

      function renderSync() {
        const s = state.settings?.sync || {};
        return `<h1>Sync</h1><h2>Browser data sync</h2><div class="card"><div class="row"><div class="row-main"><div class="row-title">Status</div><div class="row-subtitle">${esc(s.error || s.status || "Not configured")}</div></div>${s.isSyncing ? `<span class="row-meta">Syncing…</span>` : ""}</div><div class="row"><div class="row-main"><div class="row-title">Local folder</div><div class="row-subtitle">${esc(s.folder || "Choose an iCloud Drive, Dropbox, or local folder")}</div></div><div class="actions">${s.configured ? `<button id="sync-now" class="button primary">Sync now</button><button id="sync-remove" class="button">Remove</button>` : `<button id="sync-choose" class="button primary">Choose folder…</button>`}</div></div></div>`;
      }

      function renderShortcuts() {
        const groups = {};
        (state.settings?.shortcuts || []).forEach(item => (groups[item.category] ||= []).push(item));
        const content = Object.entries(groups).map(([category, items]) => `<h2>${esc(category)}</h2><div class="card">${items.map(item => `<div class="row"><div class="row-main"><div class="row-title">${esc(item.name)}</div></div><button class="shortcut-key ${recordingShortcut === item.id ? "recording" : ""}" data-shortcut="${esc(item.id)}">${recordingShortcut === item.id ? "Press keys…" : esc(item.display)}</button></div>`).join("")}</div>`).join("");
        return `<div class="actions" style="justify-content:space-between"><h1 style="margin-bottom:0">Shortcuts</h1><button id="shortcuts-reset" class="button">Restore defaults</button></div>${content}`;
      }

      function historyPage() {
        const q = query.trim().toLowerCase();
        const items = (state.history || []).filter(item => !q || `${item.title} ${item.url}`.toLowerCase().includes(q));
        const grouped = {};
        items.forEach(item => (grouped[item.group || "Earlier"] ||= []).push(item));
        const content = Object.entries(grouped).map(([group, rows]) => `<div class="group-title">${esc(group)}</div><div class="card">${rows.map(item => `<div class="row history-row clickable" data-open="${esc(item.url)}"><input class="check" type="checkbox"><span class="row-meta">${esc(item.timeLabel)}</span><span class="favicon">${esc(initial(domain(item.url)))}</span><div class="row-main"><div class="row-title">${esc(item.title)}</div><div class="row-subtitle">${esc(domain(item.url))}</div></div><button class="icon-button" title="Delete" data-delete-history="${esc(item.id)}">×</button></div>`).join("")}</div>`).join("") || `<div class="empty"><div class="empty-icon">↶</div>${q ? "No matching history" : "Your browsing history appears here"}</div>`;
        const sidebar = `<div class="nav-section">${nav("history", "↶", "Actro history", true, "actro://history")}<button id="clear-history" class="nav-item"><span class="nav-icon">⌫</span><span>Delete browsing data</span></button></div>`;
        return shell("History", sidebar, content, "Search history");
      }

      function bookmarksPage() {
        const q = query.trim().toLowerCase();
        const all = state.bookmarks || [];
        const tags = [...new Set(all.flatMap(item => item.tags || []))].sort();
        const items = all.filter(item => (!q || `${item.title} ${item.url}`.toLowerCase().includes(q)) && (bookmarkFolder === "all" || (item.tags || []).includes(bookmarkFolder)));
        const rows = items.map(item => `<div class="row clickable" data-open="${esc(item.url)}" data-bookmark-id="${esc(item.id)}"><span class="favicon">${esc(initial(item.title))}</span><div class="row-main"><div class="row-title">${esc(item.title)}${(item.tags || []).map(tag => `<span class="tag">${esc(tag)}</span>`).join("")}</div><div class="row-subtitle">${esc(domain(item.url))}</div></div><button class="icon-button" title="Delete" data-delete-bookmark="${esc(item.id)}">×</button></div>`).join("") || `<div class="empty"><div class="empty-icon">☆</div>${q ? "No matching bookmarks" : "Bookmarks you add appear here"}</div>`;
        const folderNav = nav("all", "▱", "All bookmarks", bookmarkFolder === "all", "#all") + tags.map(tag => nav(tag, "▱", tag, bookmarkFolder === tag, `#tag:${encodeURIComponent(tag)}`)).join("");
        return shell("Bookmarks", `<div class="nav-section">${folderNav}</div>`, `<div class="card">${rows}</div>`, "Search bookmarks");
      }

      function render() {
        document.documentElement.dataset.theme = state.theme || "light";
        document.title = state.page === "history" ? "History" : state.page === "bookmarks" ? "Bookmarks" : "Settings";
        app.innerHTML = state.page === "history" ? historyPage() : state.page === "bookmarks" ? bookmarksPage() : settingsSection();
        bind();
      }

      function bind() {
        const search = document.getElementById("page-search");
        search?.addEventListener("input", event => { query = event.target.value; render(); document.getElementById("page-search")?.focus(); document.getElementById("page-search")?.setSelectionRange(query.length, query.length); });
        document.querySelectorAll("[data-route]").forEach(element => element.addEventListener("click", () => post({type:"navigateInternal", url:element.dataset.route})));
        document.querySelectorAll("[data-appearance]").forEach(element => element.addEventListener("click", () => post({type:"setAppearance", value:element.dataset.appearance})));
        document.querySelectorAll("[data-window-chrome]").forEach(element => element.addEventListener("click", () => {
          state.settings = {...(state.settings || {}), windowChrome: element.dataset.windowChrome};
          render();
          post({type:"setWindowChrome", value:element.dataset.windowChrome});
        }));
        document.getElementById("search-engine")?.addEventListener("change", event => post({type:"setSearchEngine", value:event.target.value}));
        document.getElementById("content-blocking")?.addEventListener("change", event => post({type:"setContentBlocking", value:event.target.checked}));
        document.getElementById("clear-data")?.addEventListener("click", () => post({type:"clearBrowsingData", range:document.getElementById("clear-range").value, dataTypes:[...document.querySelectorAll("[data-clear-type]:checked")].map(e => e.dataset.clearType)}));
        document.getElementById("clear-history")?.addEventListener("click", () => { if (confirm("Delete all browsing history?")) post({type:"clearHistory"}); });
        document.querySelectorAll("[data-open]").forEach(element => element.addEventListener("click", event => { if (event.target.closest("button,input")) return; post({type:"openURL", url:element.dataset.open, bookmarkId:element.dataset.bookmarkId || null}); }));
        document.querySelectorAll("[data-delete-history]").forEach(element => element.addEventListener("click", event => { event.stopPropagation(); post({type:"deleteHistory", id:element.dataset.deleteHistory}); }));
        document.querySelectorAll("[data-delete-bookmark]").forEach(element => element.addEventListener("click", event => { event.stopPropagation(); post({type:"deleteBookmark", id:element.dataset.deleteBookmark}); }));
        document.querySelectorAll('[data-route^="#"]').forEach(element => element.addEventListener("click", event => { event.stopImmediatePropagation(); const route = element.dataset.route; bookmarkFolder = route === "#all" ? "all" : decodeURIComponent(route.slice(5)); render(); }));
        document.getElementById("vault-setup")?.addEventListener("submit", event => { event.preventDefault(); const data = new FormData(event.target); if (data.get("password") !== data.get("confirm")) return showToast("Passwords do not match", "error"); post({type:"vaultSetup", password:data.get("password"), hint:data.get("hint")}); });
        document.getElementById("vault-unlock")?.addEventListener("submit", event => { event.preventDefault(); post({type:"vaultUnlock", password:new FormData(event.target).get("password")}); });
        document.getElementById("vault-biometric")?.addEventListener("click", () => post({type:"vaultUnlockWithBiometrics"}));
        document.getElementById("vault-lock")?.addEventListener("click", () => post({type:"vaultLock"}));
        document.getElementById("vault-reset")?.addEventListener("click", () => { if (confirm("Permanently delete the password vault?")) post({type:"vaultReset"}); });
        document.getElementById("shortcuts-reset")?.addEventListener("click", () => post({type:"resetShortcuts"}));
        document.querySelectorAll("[data-shortcut]").forEach(element => element.addEventListener("click", () => { recordingShortcut = element.dataset.shortcut; render(); }));
        document.getElementById("sync-choose")?.addEventListener("click", () => post({type:"chooseSyncFolder"}));
        document.getElementById("sync-now")?.addEventListener("click", () => post({type:"syncNow"}));
        document.getElementById("sync-remove")?.addEventListener("click", () => post({type:"removeSyncFolder"}));
      }

      document.addEventListener("keydown", event => {
        if (!recordingShortcut) return;
        event.preventDefault();
        event.stopPropagation();
        if (["Meta","Shift","Alt","Control"].includes(event.key)) return;
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        const modifiers = (event.ctrlKey ? 262144 : 0) | (event.shiftKey ? 131072 : 0) | (event.altKey ? 524288 : 0) | (event.metaKey ? 1048576 : 0);
        post({type:"updateShortcut", actionId:recordingShortcut, key, modifiers});
        recordingShortcut = null;
      }, true);

      let toastTimer;
      function showToast(message, kind = "success") {
        toast.textContent = message;
        toast.className = `toast ${kind === "error" ? "error" : ""} show`;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.className = "toast", 2600);
      }

      window.actroInternal = {
        receiveBase64(base64) { state = decode(base64); render(); },
        notifyBase64(base64) { const value = decode(base64); showToast(value.message, value.kind); }
      };
    })();
  </script>
</body>
</html>
