import java.util.Properties

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "kotlin-parcelize"
apply plugin: "com.google.protobuf"
apply plugin: "kotlin-kapt"
apply plugin: "com.google.devtools.ksp"
apply plugin: "okhttp-dns-plugin"


// Initialize local.properties to read local configurations
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

// Match build config to gradle.properties newArchEnabled.

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    def nodeBinaryPath = localProperties.getProperty('reactNative.nodeExecutableAndArgs') ?: "node"
    nodeExecutableAndArgs = [nodeBinaryPath]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.askaway.android"
    defaultConfig {
        applicationId "chat.askaway.android"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1_28_00
        versionName "1.28.0"

//        externalNativeBuild {
//            cmake {
//                cppFlags '-std=c++17 -fexceptions -frtti'
//                arguments '-DANDROID_STL=c++_shared'
//            }
//        }
    }
    def isCI = System.getenv("CI") == "true"

    signingConfigs {
        release {
            if (isCI) {
                storeFile file(System.getenv("KEYSTORE_PATH") ?: '../AskAway.jks')
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: ''
                keyAlias System.getenv("KEY_ALIAS") ?: ''
                keyPassword System.getenv("KEY_PASSWORD") ?: ''
            } else {
                storeFile file(localProperties.getProperty('KEYSTORE_PATH') ?: '../AskAway.jks')
                storePassword localProperties.getProperty('KEYSTORE_PASSWORD') ?: ''
                keyAlias localProperties.getProperty('KEY_ALIAS') ?: ''
                keyPassword localProperties.getProperty('KEY_PASSWORD') ?: ''
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    viewBinding {
        enabled = true
    }
    packaging {
        jniLibs {
            // 当遇到重复的 libjsi.so 时，选择第一个遇到的文件（通常是主框架的文件）
            pickFirst '**/libjsi.so'

            // 建议同时也加上 libc++_shared.so，这是另一个常见的冲突库
            pickFirst '**/libc++_shared.so'
        }
    }
}

protobuf {
    protoc { artifact = "com.google.protobuf:protoc:3.25.1" }
    generateProtoTasks {
        all().forEach { task -> task.builtins { create("java") { option("lite") } } }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // SplashScreen
    implementation("androidx.core:core-splashscreen:1.0.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    implementation(project(":actr-kotlin"))
    implementation(project(":rill-sandbox-native"))
    implementation(project(":react-native-safe-area-context"))
    implementation(project(":react-native-view-shot"))
    // AndroidX and Material Design
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("com.google.android.material:material:1.11.0")
    implementation("androidx.fragment:fragment-ktx:1.6.2")
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.7.0"
    implementation("com.google.protobuf:protobuf-javalite:3.25.1")
    implementation("org.greenrobot:eventbus:3.3.1")
    implementation("io.coil-kt:coil:2.6.0")
    implementation("com.tencent.mm.opensdk:wechat-sdk-android:+")
    // Google Sign-In (Credential Manager)
    implementation("androidx.credentials:credentials:1.5.0")
    implementation("androidx.credentials:credentials-play-services-auth:1.5.0")
    implementation("com.google.android.libraries.identity.googleid:googleid:1.1.1")
    implementation("androidx.room:room-runtime:2.8.0-beta01")
    implementation("androidx.room:room-ktx:2.8.0-beta01")
    ksp("androidx.room:room-compiler:2.8.0-beta01")
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'com.hankcs:hanlp:portable-1.8.6'
    implementation 'net.java.dev.jna:jna:5.14.0@aar'
}
