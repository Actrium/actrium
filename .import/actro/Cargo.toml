[workspace]
members = [
    "client",
    "host",
    "libs/hbb_common",
    "libs/scrap",
    "libs/enigo",
    "libs/clipboard",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0"
repository = "https://github.com/kookyleo/rustdesk-actr"

[workspace.dependencies]
# Local libraries
hbb_common = { path = "libs/hbb_common" }
scrap = { path = "libs/scrap" }
enigo = { path = "libs/enigo", features = ["with_serde"] }
clipboard = { path = "libs/clipboard" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# ACTR framework
actr = { git = "https://github.com/actor-rtc/actr.git", branch = "main", features = ["runtime", "config"] }

# Protobuf support
prost = "0.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0"
toml = "0.8"

# CLI and config
clap = "4.2"
rpassword = "7.2"

# Logging
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"

# Futures
futures-util = "0.3"

# Utilities
uuid = { version = "1.3", features = ["v4"] }
lazy_static = "1.4"
bytes = { version = "1.4", features = ["serde"] }
url = { version = "2.3", features = ["serde"] }
crossbeam-queue = "0.3"
hex = "0.4"
chrono = "0.4"
cfg-if = "1.0"
sha2 = "0.10"
fon = "0.6"
include_dir = "0.7"
num_cpus = "1.15"
errno = "0.3"

# Audio
magnum-opus = { git = "https://github.com/rustdesk-org/magnum-opus" }
dasp = { version = "0.11", features = ["signal", "interpolate-linear", "interpolate"] }

# Input device
rdev = { git = "https://github.com/rustdesk-org/rdev" }

# Networking
parity-tokio-ipc = { git = "https://github.com/rustdesk-org/parity-tokio-ipc" }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }

[workspace.dependencies.keepawake]
git = "https://github.com/rustdesk-org/keepawake-rs"

# macOS-specific dependencies
[workspace.dependencies.cpal]
git = "https://github.com/rustdesk-org/cpal"
branch = "osx-screencapturekit"

[workspace.dependencies.arboard]
git = "https://github.com/rustdesk-org/arboard"
features = ["wayland-data-control"]

[workspace.dependencies.clipboard-master]
git = "https://github.com/rustdesk-org/clipboard-master"

[workspace.dependencies.portable-pty]
git = "https://github.com/rustdesk-org/wezterm"
branch = "rustdesk/pty_based_0.8.1"
package = "portable-pty"

# macOS frameworks
[workspace.dependencies.objc]
version = "0.2"

[workspace.dependencies.cocoa]
version = "0.24"

[workspace.dependencies.dispatch]
version = "0.2"

[workspace.dependencies.core-foundation]
version = "0.9"

[workspace.dependencies.core-graphics]
version = "0.22"

[workspace.dependencies.ringbuf]
version = "0.3"

[workspace.dependencies.whoami]
version = "1.5"

[workspace.dependencies.cidr-utils]
version = "0.5"

[workspace.dependencies.repng]
version = "0.2"

[workspace.dependencies.ctrlc]
version = "3.2"

[workspace.dependencies.shutdown_hooks]
version = "0.1"

[workspace.dependencies.system_shutdown]
version = "4.0"

[workspace.dependencies.totp-rs]
version = "5.4"
default-features = false
features = ["gen_secret", "otpauth"]

# Build dependencies
[workspace.dependencies.cc]
version = "1.0"

[workspace.dependencies.prost-build]
version = "0.14"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
