[workspace]
resolver = "2"
members = [
    "crates/actro-core",
    "crates/actro-sync-server",
    "crates/actro-vault",
    "crates/actro-terminal",
    "crates/actro-remote",
]
exclude = [
    "third_party/actor-rtc-actr",
    "third_party/rustdesk-actr",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/kookyleo/actro"
