name: Repository hygiene

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  large-and-vendored-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Android binary asset lock
        run: >-
          java scripts/PrepareAndroidBinaryAssets.java
          --lock apps/android/actro/android/binary-assets.lock.properties
          --validate-only

      - name: Enforce reviewed large-file budgets
        run: scripts/check-large-files.sh

      - name: Verify vendored assets
        run: scripts/verify-vendored-assets.sh
