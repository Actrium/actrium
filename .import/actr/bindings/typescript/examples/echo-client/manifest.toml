edition = 1
exports = []

[package]
name = "echo-client-app"
manufacturer = "acme"
description = "Echo Client Example"

[dependencies]
EchoService = { actr_type = "acme+EchoService" }
EchoTwiceService = { actr_type = "acme+EchoTwiceService" }

[system.signaling]
url = "wss://loran1.actrium-dev.example/signaling/ws"

[system.deployment]
realm_id = 2368266035

[system.discovery]
visible = true

[system.webrtc]
force_relay = false
stun_urls = ["stun:loran1.actrium-dev.example:3478"]
turn_urls = ["turn:loran1.actrium-dev.example:3478"]

[acl]

[[acl.rules]]
permission = "allow"
types = ["acme+EchoService", "acme+EchoTwiceService"]
