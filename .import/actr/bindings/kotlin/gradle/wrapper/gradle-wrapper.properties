# The self-hosted CI fleet has slow egress to services.gradle.org; the
# Tencent Cloud mirror serves the identical distribution zip at LAN speed, so a
# wrapper re-download costs seconds instead of ~8-12 minutes. Revert to
# https\://services.gradle.org/distributions/gradle-9.2.1-bin.zip if building
# outside the Actrium CI network.
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.2.1-bin.zip
# SHA-256 of the canonical Gradle 9.2.1 binary distribution. The mirror must
# serve this exact archive.
distributionSha256Sum=72f44c9f8ebcb1af43838f45ee5c4aa9c5444898b3468ab3f4af7b6076c5bc3f
networkTimeout=10000
validateDistributionUrl=true
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
