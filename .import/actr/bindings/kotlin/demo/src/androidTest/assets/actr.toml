edition = 1
exports = []

[package]
name = "android-echo-client"
description = "Android Echo Client"

[package.actr_type]
manufacturer = "acme"
name = "echo-client-app"
authors = []
license = "Apache-2.0"
tags = ["dev", "example", "android"]

[dependencies]
echo-echo-server = { actr_type = "acme+EchoService" }
data-stream-peer-concurrent-server-python = { actr_type = "acme+DataStreamConcurrentServer" }

[system.signaling]
url = "wss://loran1.actrium-dev.example/signaling/ws"

[system.webrtc]
stun_urls = ["stun:loran1.actrium-dev.example:3478"]
turn_urls = ["turn:loran1.actrium-dev.example:3478"]
force_relay = true

[system.deployment]
realm_id = 2368266035

[system.discovery]
visible = true

[system.observability]
filter_level = "info"
tracing_enabled = false
tracing_endpoint = "http://localhost:4317"
tracing_service_name = "android-echo-client"

# ACL configuration
[acl]

[[acl.rules]]
permission = "allow"
types = ["acme+EchoService", "acme+DataStreamConcurrentServer"]

[scripts]
