name: Release ActrSharp

# Manually validates or recovers ActrSharp publishing for an existing stable
# release tag. New versions are still published by the staged release train.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag, for example v0.8.0.
        required: true
        type: string
      dry_run:
        description: Validate and package without publishing.
        required: true
        default: true
        type: boolean

concurrency:
  group: release-actrsharp-${{ inputs.tag }}
  cancel-in-progress: false

permissions: {}

jobs:
  resolve-release:
    name: Resolve existing release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_sha: ${{ steps.resolve.outputs.release_sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Validate tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Expected a stable release tag in vX.Y.Z form, got $TAG"
            exit 1
          }

      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Resolve release context
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"

  publish-actrsharp:
    name: Publish existing ActrSharp release
    needs: resolve-release
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish-actrsharp.yml
    with:
      version: ${{ needs.resolve-release.outputs.version }}
      source_ref: refs/tags/${{ inputs.tag }}
      release_sha: ${{ needs.resolve-release.outputs.release_sha }}
      publish: ${{ !inputs.dry_run }}
    secrets: inherit
