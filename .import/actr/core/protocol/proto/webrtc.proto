syntax = "proto2";

package webrtc;

// IceCandidate mirrors the WebRTC standard RTCIceCandidateInit interface.
message IceCandidate {
  required string candidate = 1;
  optional string sdp_mid = 2;
  optional uint32 sdp_mline_index = 3;
  optional string username_fragment = 4;
}

// SessionDescription is the unified wrapper for SDP. All track information is encoded in the `sdp` string.
message SessionDescription {
  enum Type {
    OFFER = 0;
    ANSWER = 1;
    RENEGOTIATION_OFFER = 2;
    ICE_RESTART_OFFER = 3;
  }
  required Type type = 1;
  required string sdp = 2;
  // End-to-end correlation id for one SDP offer/answer exchange.
  // Offer-like messages create it; the Answer echoes the same id.
  optional string sdp_exchange_id = 3;
}

// Rejects an ICE restart that cannot be applied to the receiver's current
// PeerConnection. The sender must correlate this with its in-flight restart
// offer and discard that stale session before starting a fresh negotiation.
message IceRestartRejected {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    NO_ACTIVE_SESSION = 1;
  }

  required string sdp_exchange_id = 1;
  optional Reason reason = 2 [default = REASON_UNSPECIFIED];
}
