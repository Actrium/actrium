// Protobuf options for declarative lane selection

syntax = "proto2";

package actr;

import "google/protobuf/descriptor.proto";

// Payload types for traffic segregation (message type + transport characteristics)
// Format: <MessageType>_<TransportMode>
enum PayloadType {
    // RpcEnvelope types
    RPC_RELIABLE = 0;           // RpcEnvelope with reliable ordered transmission - DEFAULT
    RPC_SIGNAL = 1;             // RpcEnvelope with high-priority signaling channel

    // StreamChunk types
    STREAM_RELIABLE = 2;        // StreamChunk with reliable ordered transmission
    STREAM_LATENCY_FIRST = 3;   // StreamChunk with low latency partial-reliable transmission

    // MediaFrame types
    MEDIA_RTP = 4;              // MediaFrame over WebRTC RTP MediaTrack
}

// Method-level option for lane selection
extend google.protobuf.MethodOptions {
    optional PayloadType payload_type = 50001;
}

// Reply mode: how the callee delivers a response for an RPC method.
//
// RETURN   (default): the reply is the handler's return value. Dispatch
//                     completion and reply coincide — behavior is identical
//                     to pre-RFC-0323 codegen.
// EXPLICIT: the reply is sent through a movable `Reply<T>` handle, so the
//           handler may return (releasing its dispatch slot / conflict key)
//           before the reply is produced. See RFC-0323.
enum ReplyMode {
    REPLY_MODE_RETURN = 0;    // Reply through the handler return value (default)
    REPLY_MODE_EXPLICIT = 1; // Reply explicitly through a Reply<T> handle
}

// Method-level option for reply mode selection (RFC-0323).
extend google.protobuf.MethodOptions {
    optional ReplyMode reply_mode = 50002;
}
