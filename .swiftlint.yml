included:
  - packages/actr-swift
  - tools/actr/protoc-gen/swift
  - examples/actr/audio-capture/AudioCaptureApp

excluded:
  - packages/actr-swift/.build
  - packages/actr-swift/ActrBindings
  - packages/actr-swift/ActrFFI.xcframework
  - tools/actr/protoc-gen/swift/.build
  - examples/actr/audio-capture/AudioCaptureApp/.build

disabled_rules:
  - closure_parameter_position
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - identifier_name
  - line_length
  - opening_brace
  - trailing_comma
  - type_body_length

reporter: github-actions-logging
