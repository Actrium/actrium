enable = 29
name = "winui-echo-app-e2e"
env = "dev"
sqlite_path = "__SQLITE_DIR__"
location_tag = "local,e2e,winui-echo-app"
loran_shared_key = "loran-e2e-shared-key-0123456789abcdef"

[control]
head = "admin_ui"

[control.admin_ui]
password = "e2e-test-password"

[authority]
uri = "actr://localhost"

[bind.http]
domain_name = "127.0.0.1"
advertised_ip = "127.0.0.1"
ip = "127.0.0.1"
port = __HTTP_PORT__

[bind.ice]
domain_name = "__ICE_HOST__"
ip = "__ICE_HOST__"
port = __ICE_PORT__
advertised_ip = "__ICE_HOST__"
advertised_port = __ICE_PORT__

[turn]
advertised_ip = "__ICE_HOST__"
advertised_port = __ICE_PORT__
relay_port_range = "49152-49200"
realm = "local.loran"

[services.signer]

[services.issuer]

[services.issuer.server]
renewal_token_secret = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

[services.signaling]

[services.signaling.server]
ws_path = "/signaling"
