[workspace]
members = [
    "package-runtime-echo/client",
    "package-runtime-echo/client-guest",
    "polyglot-echo/clients/rust",
    "polyglot-echo/server",
    "polyglot-echo/services/linked-rust",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
actr-framework = { path = "../../../crates/actr-framework" }
actr-protocol = { path = "../../../crates/actr-protocol" }
actr-runtime = { path = "../../../crates/actr-runtime" }
actr-hyper = { path = "../../../crates/actr-hyper", features = ["opentelemetry"] }
actr-config = { path = "../../../crates/actr-config" }
actr-platform-native = { path = "../../../crates/actr-platform-native" }
actr-pack = { path = "../../../crates/actr-pack" }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
prost = "0.14"
bytes = "1.11"
async-trait = "0.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Native RTC/WebRTC Git sources come from the SDK dependency declarations.
# Only legacy TURN server crates require these workspace-root overrides.
[patch.crates-io]
turn = { git = "https://github.com/webrtc-rs/webrtc", rev = "c229349e67cc235e6737bbf92bd7dd48fdc135fa" }
webrtc-util = { git = "https://github.com/webrtc-rs/webrtc", rev = "c229349e67cc235e6737bbf92bd7dd48fdc135fa" }
stun = { git = "https://github.com/webrtc-rs/webrtc", rev = "c229349e67cc235e6737bbf92bd7dd48fdc135fa" }
