# Internal Actrium ARC fleet, synced from the KubeSphere kubekey cluster.
# The runner image carries the bootstrap (wasm-opt, sccache, hosted-toolcache
# PATH, the Actions cache worker patch) and its own entrypoint; this manifest
# deploys that image as-is.
# The node-local Cargo registry shares crate archives and the index only; crate
# extraction is per-Pod, which is what keeps concurrent builds on one node from
# racing on the same unpack marker.
# The AutoscalingRunnerSet and controller namespace RBAC are deployed together.
# Update this configuration before applying a reviewed fleet change.
---
apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: actrium-linux
  namespace: arc-runners-actrium
  labels:
    actions.github.com/organization: Actrium
    app.kubernetes.io/version: 0.14.2
spec:
  githubConfigSecret: actrium-arc-github-app
  githubConfigUrl: https://github.com/Actrium
  maxRunners: 10
  minRunners: 10
  runnerScaleSetLabels:
  - self-hosted
  - Linux
  - X64
  runnerScaleSetName: actrium-linux
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: arc-runner
                operator: In
                values:
                - 'true'
      containers:
      # Per-Pod startup lives in the image entrypoint (pre-start sccache, then
      # the runner agent); wasm-opt, sccache and the toolcache PATH are baked
      # into the image, so no startup script is carried in this manifest.
      - env:
        - name: RUSTFLAGS
          value: "-C link-arg=-fuse-ld=mold"
        - name: HTTP_PROXY
          value: http://calm.util.zlibs.com:8128
        - name: HTTPS_PROXY
          value: http://calm.util.zlibs.com:8128
        - name: http_proxy
          value: http://calm.util.zlibs.com:8128
        - name: https_proxy
          value: http://calm.util.zlibs.com:8128
        - name: NO_PROXY
          value: 127.0.0.1,localhost,10.233.0.0/18,10.233.64.0/18,.svc,.zlibs.com,cluster.local
        - name: no_proxy
          value: 127.0.0.1,localhost,10.233.0.0/18,10.233.64.0/18,.svc,.zlibs.com,cluster.local
        - name: CARGO_NET_RETRY
          value: '20'
        - name: CARGO_HTTP_TIMEOUT
          value: '120'
        - name: SCCACHE_CACHE_SIZE
          value: 4G
        - name: SCCACHE_CACHE_DIR
          value: "/home/runner/actions-runner/_work/.sccache"
        - name: RUSTC_WRAPPER
          value: sccache
        - name: SCCACHE_ENDPOINT
          value: sccache-minio.arc-sccache.svc:9000
        - name: SCCACHE_BUCKET
          value: sccache
        - name: SCCACHE_REGION
          value: us-east-1
        - name: SCCACHE_S3_USE_SSL
          value: 'false'
        - name: SCCACHE_IDLE_TIMEOUT
          value: '0'
        - name: CARGO_INCREMENTAL
          value: '0'
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              key: AWS_ACCESS_KEY_ID
              name: sccache-s3
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: AWS_SECRET_ACCESS_KEY
              name: sccache-s3
        - name: ACTIONS_RESULTS_URL
          value: http://gha-cache-server.arc-sccache.svc:3000/
        image: harbor.zlibs.com/platform/actrium-runner:20261013-cache
        name: runner
        resources:
          limits:
            cpu: '12'
            memory: 12Gi
          requests:
            cpu: '2'
            memory: 4Gi
        volumeMounts:
        - mountPath: "/home/runner/actions-runner/_work"
          name: work
        - mountPath: "/home/runner/.cargo/registry"
          name: cargo-registry
        # Cargo unpacks .crate archives into registry/src and marks each
        # finished unpack with a .cargo-ok file. Sharing that directory across
        # the Pods on a node makes concurrent extractions of the same crate
        # collide on the marker ("failed to unpack ... File exists (os error
        # 17)") and fails the losing job, so only the archive cache and the
        # index stay shared (hostPath above) and extraction is per-Pod.
        - mountPath: "/home/runner/.cargo/registry/src"
          name: cargo-registry-src
      initContainers:
      - command:
        - sh
        - "-c"
        - install -d -o 1001 -g 1001 /home/runner/.cargo/registry
        image: harbor.zlibs.com/platform/actrium-runner:20260901
        name: fix-cargo-registry-ownership
        securityContext:
          runAsUser: 0
        volumeMounts:
        - mountPath: "/home/runner/.cargo/registry"
          name: cargo-registry
      securityContext:
        fsGroup: 1001
      volumes:
      - emptyDir:
          sizeLimit: 100Gi
        name: work
      - hostPath:
          path: "/var/openebs/cargo-registry"
          type: DirectoryOrCreate
        name: cargo-registry
      # Per-Pod extraction directory (see the volumeMounts comment). Crates are
      # re-extracted from the shared archive cache, so this costs CPU only and
      # never network. Measured extraction for this workspace is ~1.3 GiB; the
      # limit is a node-protection guard, not a working-set estimate.
      - emptyDir:
          sizeLimit: 20Gi
        name: cargo-registry-src
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arc-manager
  namespace: arc-runners-actrium
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
- apiGroups:
  - ''
  resources:
  - pods/status
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
- apiGroups:
  - ''
  resources:
  - serviceaccounts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  verbs:
  - create
  - delete
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arc-manager-binding
  namespace: arc-runners-actrium
subjects:
- kind: ServiceAccount
  name: arc-gha-rs-controller
  namespace: arc-systems
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arc-manager
