edition = 1
exports = []

[package]
name = "echo-client-app"
publisher = "{{PUBLISHER}}"
description = "An Actrium Android client"
authors = []

[dependencies]
EchoService = { actr_type = "{{PUBLISHER}}/EchoService@1.0.0" }

[system.signaling]
url = "{{SIGNALING_URL}}"

[system.issuer_endpoint]
url = "{{ISSUER_ENDPOINT_URL}}"

[system.webrtc]
stun_urls = ["stun:{{SIGNALING_HOST}}:3478"]
turn_urls = ["turn:{{SIGNALING_HOST}}:3478"]
force_relay = true

[system.deployment]
realm = "{{REALM}}"

[system.discovery]
visible = false

# ACL configuration - allow echo server
[acl]

[[acl.rules]]
permission = "allow"
principals = [
    { actr_type = { publisher = "{{PUBLISHER}}", name = "EchoService", version = "1.0.0" } },
]

[scripts]
dev = "./gradlew assembleDebug"
