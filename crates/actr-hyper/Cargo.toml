[package]
name = "actr-hyper"
version = "0.10.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Hyper — Actor platform infrastructure: sandbox, transport, scheduler, WASM engine, signing, AIS bootstrap, persistence & crypto primitives"
keywords = ["actor", "sandbox", "webassembly", "transport", "platform"]
categories = ["asynchronous", "cryptography", "network-programming"]

[lints]
workspace = true

[features]
# The v0.20 backend is the default and only PeerConnection implementation.
# Disabling default features is supported for non-RTC build surfaces; it does
# not select the removed 0.14 stack.
default = ["webrtc-v020"]
wasm-engine = ["dep:wasmtime", "dep:wasmtime-wasi"]
dynclib-engine = ["dep:libloading"]
opentelemetry = [
  "actr-config/opentelemetry",
  "dep:opentelemetry",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry-appender-tracing",
  "dep:opentelemetry_sdk",
  "dep:tracing-opentelemetry",
]
# Enable test utilities for integration tests (e.g., packet filtering and
# forced recovery against real local peer connections).
test-utils = [
  "dep:actr-mock-actrix",
  "dep:actrix-signaling-service",
  "dep:actrix-stun-service",
  "dep:actrix-turn",
  "dep:axum",
  "dep:hmac",
  "dep:platform",
  "dep:rustls",
  "dep:sha1",
  "dep:turn_crate",
  "dep:webrtc-util",
]
# Transitional source gate. The v0.20 dependencies themselves are mandatory;
# this feature only keeps the cutover diff bisectable until the module rename.
webrtc-v020 = []

[dependencies]
# === Internal ===
actr-protocol.workspace = true
actr-runtime.workspace = true
actr-framework.workspace = true
actr-platform-traits.workspace = true
# actr-config is optional here for wasm32 compat; non-optional on native (see target deps)
actr-config = { workspace = true, optional = true }

# === Async Runtime (cross-platform minimal) ===
tokio = { version = "1.48", default-features = false, features = ["sync", "macros", "rt", "time"] }
async-trait.workspace = true
futures-util.workspace = true

# === Serialization ===
serde.workspace = true
serde_json.workspace = true
prost.workspace = true
prost-types.workspace = true
bytes.workspace = true
toml.workspace = true

# === Utilities ===
uuid = { version = "1.18", features = ["v4", "serde"] }
thiserror.workspace = true
anyhow.workspace = true
yasm.workspace = true
tracing.workspace = true
chrono.workspace = true
base64.workspace = true
hex = "0.4"

# === Observability (optional) ===
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-appender-tracing = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

# ═══════════════════════════════════════════════════════════════════════════════
# wasm32-specific dependencies
# ═══════════════════════════════════════════════════════════════════════════════
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.18", features = ["v4", "serde", "js"] }
getrandom = { version = "0.2", features = ["js"] }

# ═══════════════════════════════════════════════════════════════════════════════
# Native-only dependencies (not available on wasm32)
# ═══════════════════════════════════════════════════════════════════════════════
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# actr-config is always available on native (overrides optional from [dependencies])
actr-config = { workspace = true }
actr-runtime-mailbox.workspace = true
actr-service-compat.workspace = true
actr-pack.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

# Storage
rusqlite = { workspace = true }

# Full async runtime (extends the cross-platform tokio above)
tokio = { version = "1.48", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["full"] }

# Cryptography (native implementations)
ed25519-dalek.workspace = true
sha2.workspace = true
rand.workspace = true

# Networking
webrtc.workspace = true
rtc.workspace = true
rtc-rtp.workspace = true
if-addrs.workspace = true
tokio-tungstenite.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots", "json"] }
url.workspace = true

# Utilities (native-only)
tracing-subscriber.workspace = true
tempfile.workspace = true
pwrzv.workspace = true
crossbeam.workspace = true
dashmap.workspace = true
dotenvy = "0.15"
num_cpus = "1.17"
actr-mock-actrix = { workspace = true, optional = true }
actrix-signaling-service = { package = "actrix-signaling", path = "../loran-signaling", optional = true }
actrix-stun-service = { package = "actrix-stun", path = "../loran-stun", optional = true }
actrix-turn = { path = "../loran-turn", optional = true }
axum = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
platform = { package = "actrix-platform", path = "../loran-platform", optional = true }
rustls = { workspace = true, optional = true }
sha1 = { version = "0.10", optional = true }
turn_crate = { workspace = true, optional = true }
webrtc-util = { workspace = true, optional = true }

# WASM Runtime (optional, native-only)
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }

# Dynclib Runtime (native shared library, optional)
libloading = { version = "0.8", optional = true }

# Dispatch throughput / per-dispatch overhead benchmark. `harness = false`: it
# is a plain `fn main()` that builds its own fixed-worker tokio runtime (the
# load is multi-threaded async, so criterion's synchronous harness does not
# apply). Requires `--features wasm-engine,test-utils` and the wasm fixture
# toolchain (build.rs emits `actr_wasm_fixture_available`); otherwise its main
# is a no-op stub.
[[bench]]
name = "dispatch_throughput"
harness = false

# Recovery-supervisor latency benchmarks (RFC-0400 / PR #399 quantitative
# validation): M1 acceptance latency and M2 enqueue-to-decision latency.
# `harness = false`: it owns its own single-threaded tokio runtime (the
# reconciler and its spawned effect/timer tasks are genuinely concurrent, so
# criterion's synchronous harness does not apply). No feature gate: only
# public API (`actr_hyper::lifecycle`), builds on every target.
[[bench]]
name = "recovery_latency"
harness = false

[dev-dependencies]
tokio = { workspace = true }
rand.workspace = true
base64.workspace = true
hmac.workspace = true
sha1 = "0.10"
mockito = "1.4"
wat = "1"
prost.workspace = true
tempfile.workspace = true
tokio-test = "0.4"
actr-pack.workspace = true
actr-config.workspace = true
actr-hyper = { path = ".", features = ["test-utils"] }
actr-framework = { workspace = true, features = ["test-utils"] }
tracing-log = "0.2"
