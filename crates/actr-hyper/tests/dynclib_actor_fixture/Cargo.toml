[workspace]

[package]
name = "dynclib-actor-fixture"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[features]
default = ["cdylib"]
cdylib = ["actr-framework/cdylib"]
web = []

[dependencies]
actr-framework = { path = "../../../actr-framework" }
actr-protocol = { path = "../../../actr-protocol" }
async-trait = "0.1"
bytes = "1.10"
prost = "0.14"
tokio = { version = "1.48", features = ["time"] }

[build-dependencies]
actr-framework-protoc-codegen = { path = "../../../../tools/actr/protoc-gen/rust" }
actr-protocol = { path = "../../../actr-protocol" }
prost-build = "0.14"
prost-reflect = "0.16"
