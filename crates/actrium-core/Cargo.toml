[package]
name = "actrium-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "actrium_core"
path = "src/lib.rs"

[dependencies]
actr-pack = { workspace = true, features = ["program"] }
actr-protocol.workspace = true
base64.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uniffi = { version = "0.29.2", features = ["cli"] }
url = "2"

[dev-dependencies]
rand.workspace = true
toml.workspace = true
zip = { version = "9.0.3", default-features = false }
wit-parser = "0.254.2"
wit-component = { version = "0.254.2", features = ["dummy-module"] }

[build-dependencies]
uniffi = { version = "0.29.2", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
