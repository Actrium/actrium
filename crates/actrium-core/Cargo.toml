[package]
name = "actrium-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "actrium_core"
path = "src/lib.rs"

[features]
guest-storage-sqlcipher = ["dep:hex", "dep:libsqlite3-sys", "dep:zeroize"]

[dependencies]
actr-pack.workspace = true
actr-config.workspace = true
actr-protocol.workspace = true
base64.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uniffi = { version = "0.29.2", features = ["cli"] }
url = "2"

[build-dependencies]
uniffi = { version = "0.29.2", features = ["build"] }

[target.'cfg(target_os = "macos")'.dependencies]
hex = { workspace = true, optional = true }
libsqlite3-sys = { version = "0.39", features = ["bundled-sqlcipher"], optional = true }
zeroize = { version = "1", optional = true }

[dev-dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
tempfile.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
