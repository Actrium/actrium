syntax = "proto2";

package signaling;

import "actr.proto";
import "webrtc.proto";

// Thin signaling envelope for WebSocket transport.
// Classifies flows: Peer->SignalingServer (pre-registration), Actr->SignalingServer, SignalingServer->Actr, and Actr relay.
message SignalingEnvelope {
  // Envelope metadata
  required uint32 envelope_version = 1;          // envelope schema version
  required string envelope_id = 2;               // unique id for this message
  optional string reply_for = 3;                 // correlation to a previous envelope
  // Retired in envelope version 2. Never reuse the former timestamp tag/name.
  reserved 4;
  reserved "timestamp";
  optional string traceparent = 5;               // W3C trace context header value
  optional string tracestate = 6;                // W3C trace state header value

  oneof flow {
    PeerToSignaling peer_to_server = 10;
    ActrToSignaling actr_to_server = 11;
    SignalingToActr server_to_actr = 12;
    ActrRelay actr_relay = 13;
    actr.ErrorResponse envelope_error = 14; // envelope-level failure (no payload)
  }
}

// Signing key lookup (actor queries Issuer public key by key_id for offline verification)
message GetSigningKeyRequest  { required uint32 key_id = 1; }
message GetSigningKeyResponse { required uint32 key_id = 1; required bytes pubkey = 2; }

// Flow: peer (no ActrId yet) -> SignalingServer (registration only)
message PeerToSignaling {
  oneof payload {
    actr.RegisterRequest register_request = 1;
  }
}

// Flow: ActrNode (with ActrId) -> SignalingServer
message ActrToSignaling {
  required actr.ActrId source = 1;
  required actr.AIdCredential credential = 2;

  oneof payload {
    actr.UnregisterRequest unregister_request = 3;
    actr.Ping ping = 4;

    // Discovery & selection
    actr.DiscoveryRequest discovery_request = 10;
    actr.RouteCandidatesRequest route_candidates_request = 11;
    actr.GetServiceSpecRequest get_service_spec_request = 12;
    GetSigningKeyRequest get_signing_key_request = 13;

    // Presence subscription
    actr.SubscribeActrUpRequest subscribe_actr_up_request = 20;
    actr.UnsubscribeActrUpRequest unsubscribe_actr_up_request = 21;

    // Error reporting from client
    actr.ErrorResponse error = 30;
  }

  // Removed in breaking cleanup: legacy signaling credential-update request.
  reserved 5;
  reserved "credential_update_request";
}

// Flow: SignalingServer -> Actr
message SignalingToActr {
  required actr.ActrId target = 1;

  oneof payload {
    actr.RegisterResponse register_response = 2;
    actr.UnregisterResponse unregister_response = 3;
    actr.Pong pong = 4;

    // Discovery & selection
    actr.DiscoveryResponse discovery_response = 10;
    actr.RouteCandidatesResponse route_candidates_response = 11;
    actr.GetServiceSpecResponse get_service_spec_response = 12;
    GetSigningKeyResponse get_signing_key_response = 13;

    // Presence subscription
    actr.SubscribeActrUpResponse subscribe_actr_up_response = 20;
    actr.UnsubscribeActrUpResponse unsubscribe_actr_up_response = 21;
    actr.ActrUpEvent actr_up_event = 22;

    // Server-side disposition for an ActrRelay that requested delivery
    // feedback. This reports routing/egress acceptance only; it is not an
    // end-to-end acknowledgement from the remote actor.
    RelayDeliveryResult relay_delivery_result = 23;

    // Error notification specific to the request
    actr.ErrorResponse error = 30;
  }
}

// Opaque RTC attempt identity supplied by the sender and echoed by Actrix.
// Actrix does not interpret these values; the originating runtime uses them
// to reject a delayed delivery result from an older Controller/transport/PC
// (and, for generation-0 role probes, from an earlier probe of the same
// transport attempt).
message RelayDeliveryContext {
  required uint64 controller_lifecycle_id = 1;
  required uint64 transport_epoch = 2;
  required uint64 pc_generation = 3;
  // Correlates generation-0 role-negotiation probes to their emission epoch;
  // absent from pre-correlation senders.
  optional uint64 negotiation_epoch = 4;
}

// Closed delivery-result domain. New failure classes must be mapped into one
// of these wire-stable dispositions rather than extending behavior implicitly.
enum RelayDeliveryStatus {
  RELAY_DELIVERY_ACCEPTED = 0;
  RELAY_DELIVERY_TARGET_UNAVAILABLE = 1;
  RELAY_DELIVERY_REJECTED = 2;
}

message RelayDeliveryResult {
  required actr.ActrId target = 1;
  required RelayDeliveryContext context = 2;
  required RelayDeliveryStatus status = 3;
}

// Flow: Actr -> SignalingServer -> Actr (explicit relay, e.g., WebRTC signaling)
message ActrRelay {
  required actr.ActrId source = 1;
  required actr.AIdCredential credential = 2;
  required actr.ActrId target = 3;
  // Present only for recovery/negotiation-critical relays that require a
  // server delivery disposition. Legacy senders omit it; legacy servers
  // safely ignore it.
  optional RelayDeliveryContext delivery_context = 4;

  oneof payload {
    webrtc.IceCandidate ice_candidate = 10;
    webrtc.SessionDescription session_description = 11;
    // Decide offerer vs answerer before SDP exchange
    actr.RoleNegotiation role_negotiation = 12;
    actr.RoleAssignment role_assignment = 13;
    // Answerer notifies Offerer to immediately retry ICE restart (Option A)
    actr.IceRestartRequest ice_restart_request = 14;
    // Receiver cannot apply the correlated restart to an active session.
    webrtc.IceRestartRejected ice_restart_rejected = 15;
    // Receiver confirms or rejects a correlated Answerer restart request.
    actr.IceRestartRequestAck ice_restart_request_ack = 16;
  }
}
