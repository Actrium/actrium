[package]
name = "actr-pack"
version = "0.10.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ACTR package format: ZIP STORE-based .actr file reading, writing, signing and verification"

[lints]
workspace = true

[features]
default = []
program = ["dep:actr-service-compat", "dep:semver", "dep:serde_json", "dep:wit-parser", "dep:wasmparser", "dep:oxc_allocator", "dep:oxc_ast", "dep:oxc_ast_visit", "dep:oxc_parser", "dep:oxc_span"]

[dependencies]
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
sha2.workspace = true
ed25519-dalek.workspace = true
toml.workspace = true
serde = { version = "1.0", features = ["derive"] }
base64.workspace = true
hex = "0.4"
thiserror.workspace = true
tracing.workspace = true
actr-protocol.workspace = true
actr-service-compat = { workspace = true, optional = true }
semver = { version = "1", optional = true }
serde_json = { workspace = true, optional = true }
wit-parser = { version = "0.254.2", optional = true }
wasmparser = { version = "0.254.2", optional = true }
oxc_allocator = { version = "=0.110.0", optional = true }
oxc_ast = { version = "=0.110.0", optional = true }
oxc_ast_visit = { version = "=0.110.0", optional = true }
oxc_parser = { version = "=0.110.0", optional = true }
oxc_span = { version = "=0.110.0", optional = true }

[dev-dependencies]
rand.workspace = true
