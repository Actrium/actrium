edition = 1
exports = ["./proto/echo-twice.proto"]

[package]
name = "EchoTwiceService"
manufacturer = "acme"
description = "EchoTwice Server Example"

[system.signaling]
url = "wss://loran1.actrium-dev.example/signaling/ws"

[system.deployment]
realm_id = 2368266035

[system.discovery]
visible = true

[system.webrtc]
force_relay = false
stun_urls = ["stun:loran1.actrium-dev.example:3478"]
turn_urls = ["turn:loran1.actrium-dev.example:3478"]

[acl]

[[acl.rules]]
permission = "allow"
types = ["acme+echo-client-app"]
