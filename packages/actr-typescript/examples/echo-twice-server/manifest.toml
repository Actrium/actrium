edition = 1
exports = ["./proto/echo-twice.proto"]

[package]
name = "EchoTwiceService"
publisher = "acme"
version = "1.0.0"
description = "EchoTwice Server Example"

[system.signaling]
url = "wss://actrix1.develenv.com/signaling/ws"

[system.deployment]
realm = "echo@example.com"

[system.discovery]
visible = true

[system.webrtc]
force_relay = false
stun_urls = ["stun:actrix1.develenv.com:3478"]
turn_urls = ["turn:actrix1.develenv.com:3478"]

[acl]

[[acl.rules]]
permission = "allow"
types = ["acme/echo-client-app@1.0.0"]
