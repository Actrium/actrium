edition = 1
exports = []

[package]
name = "echo-client-app"
publisher = "acme"
version = "1.0.0"
description = "Echo Client Example"

[dependencies]
EchoService = { actr_type = "acme/EchoService@1.0.0" }
EchoTwiceService = { actr_type = "acme/EchoTwiceService@1.0.0" }

[system.signaling]
url = "wss://actrix1.develenv.com/signaling/ws"

[system.deployment]
realm = "echo@example.com"

[system.discovery]
visible = true

[system.webrtc]
force_relay = false
stun_urls = ["stun:actrix1.develenv.com:3478"]
turn_urls = ["turn:actrix1.develenv.com:3478"]

[acl]

[[acl.rules]]
permission = "allow"
types = ["acme/EchoService@1.0.0", "acme/EchoTwiceService@1.0.0"]
