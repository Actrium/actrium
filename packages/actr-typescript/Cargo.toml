# Standalone crate: napi-rs builds this independently, outside the main
# Rust workspace. The empty [workspace] table keeps Cargo from auto-joining
# any workspace it finds above this path.
[workspace]

[package]
name = "actr-ts"
version = "0.10.7"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/Actrium/actrium.git"
authors = ["Actor-RTC Contributors"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi-rs
napi = { version = "3.8.2", features = ["async", "tokio_rt", "napi6"] }
napi-derive = "3.5.1"

# actr dependencies
actr-protocol = { path = "../../crates/actr-protocol" }
actr-framework = { path = "../../crates/actr-framework" }
actr-config = { path = "../../crates/actr-config" }
actr-hyper = { path = "../../crates/actr-hyper" }

# Async runtime
tokio = { version = "1", features = ["full"] }
bytes = "1"
async-trait = "0.1"

# Utilities
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
napi-build = "2"

[profile.release]
# lto = true
strip = true

# Native RTC/WebRTC Git sources come from the SDK dependency declarations.
# Only legacy TURN server crates require these workspace-root overrides.
[patch.crates-io]
turn = { git = "https://github.com/webrtc-rs/webrtc", rev = "c229349e67cc235e6737bbf92bd7dd48fdc135fa" }
webrtc-util = { git = "https://github.com/webrtc-rs/webrtc", rev = "c229349e67cc235e6737bbf92bd7dd48fdc135fa" }
stun = { git = "https://github.com/webrtc-rs/webrtc", rev = "c229349e67cc235e6737bbf92bd7dd48fdc135fa" }
