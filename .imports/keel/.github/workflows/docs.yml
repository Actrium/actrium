# Docs site: VitePress on GitHub Pages.
#
# Why Actions, not a gh-pages branch: this repository forbids creating
# branches other than stack/* (and main, which is protected). Pages from a
# branch is therefore not an option. The workflow uploads the built site as
# a Pages artifact and deploys that.
#
# Why a separate workflow from CI: the product test matrix is already long.
# Building the site is a few seconds and only needs bun + VitePress; keeping
# it here means a docs-only PR does not wait on native / WASM jobs, and a
# product PR that does not touch docs still proves the site compiles.
#
# Visibility is Private Pages (Enterprise). Enabling that is a repository
# setting (Settings → Pages → Source: GitHub Actions, Visibility: Private)
# and is not something this file can flip. Until it is on, the deploy job
# fails with a Pages-not-configured error; the build job still gates PRs.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "stack/**"]
  workflow_dispatch:

# Deploy needs pages:write + id-token:write. Fork PRs get a read-only token;
# they only run the build job (deploy is skipped below).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # lastUpdated reads git blame; a shallow clone would stamp every
          # page with the merge commit instead of the authoring commit.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build docs
        run: bun run docs:build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
