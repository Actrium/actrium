name: Set up light runner
description: Configure GitHub cache and artifact endpoints for the light runner pool.
runs:
  using: composite
  steps:
    - name: Restore GitHub results endpoint
      uses: actions/github-script@v7
      with:
        script: |
          const results = process.env.ACTIONS_RESULTS_ORL || process.env.ACTIONS_RESULTS_URL;
          if (!results || new URL(results).protocol !== 'https:' || /[\r\n]/.test(results)) {
            throw new Error('The GitHub results endpoint is unavailable');
          }
          core.exportVariable('ACTIONS_RESULTS_URL', results);
