name: PR Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: Validate PR title
    runs-on: ubuntu-24.04
    steps:
      - name: Check conventional commit format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$TITLE" | grep -qE '^(feat|fix|chore|docs|style|refactor|test|ci|perf|build|revert)(\([^)]+\))?!?: '; then
            echo "✓ PR title follows Conventional Commits format"
            exit 0
          fi
          echo "::error::PR title does not follow Conventional Commits format"
          echo "Expected: <type>[optional scope]: <description>"
          echo "Examples:"
          echo "  feat: add streaming API"
          echo "  fix(hyper): prevent duplicate disconnect"
          echo "  chore(deps): bump tokio to 1.45"
          echo "Valid types: feat, fix, chore, docs, style, refactor, test, ci, perf, build, revert"
          exit 1

      - name: Check PR title and description for Han characters
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { pull_request: pr } = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const han = /\p{Script=Han}/u;
          for (const [field, value] of [['title', pr.title], ['description', pr.body ?? '']]) {
            if (han.test(value)) {
              console.error(`::error::Please use English in the PR ${field}. Han characters were detected.`);
              process.exitCode = 1;
            }
          }
          NODE
