name: CI (actrix deploy)

# actrix/deploy is a self-contained bootstrap CLI kept in its own sub-workspace
# (excluded from the actr root workspace, no actr/actrix dependencies), so it
# gets its own job that only runs when deploy changes.
on:
  push:
    branches: [main]
    paths:
      - "actrix/deploy/**"
      - ".github/workflows/ci-actrix-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "actrix/deploy/**"
      - ".github/workflows/ci-actrix-deploy.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: actrix/deploy

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt / clippy / build / test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-features

      - name: Test
        run: cargo test --all-features
