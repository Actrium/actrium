name: Issue language

on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    - cron: '23 3 * * *'

permissions: {}

jobs:
  moderate:
    if: github.repository == 'Actrium/actrium'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
    concurrency:
      group: issue-language-${{ github.event.issue.number || 'sweep' }}
      cancel-in-progress: false
    steps:
      - name: Remind authors or close expired issues
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const repo = context.repo;
            const api = github.rest.issues;
            const label = 'needs-english';
            const graceMs = 7 * 24 * 60 * 60 * 1000;
            const han = /\p{Script=Han}/u;
            const bot = 'github-actions[bot]';
            const fromBot = (user) => user?.type === 'Bot' && user.login === bot;
            const params = (issue_number) => ({ ...repo, issue_number });
            const hasHan = (issue) => han.test(issue.title) || han.test(issue.body ?? '');
            const hasLabel = (issue) => issue.labels.some((item) =>
              (typeof item === 'string' ? item : item.name)?.toLowerCase() === label
            );
            const isOpenIssue = (issue) => issue.state === 'open' && !issue.pull_request;
            const getIssue = async (issueNumber) => (await api.get(params(issueNumber))).data;

            // A bot-verified fix or a reopen starts a new episode. A manual label removal,
            // unrelated edit, or comment cannot reset the original grace period.
            async function episode(issueNumber) {
              const events = await github.paginate(api.listEvents, { ...params(issueNumber), per_page: 100 });
              const boundary = events.filter((event) => event.event === 'reopened' ||
                (event.event === 'unlabeled' && fromBot(event.actor) && event.label?.name?.toLowerCase() === label)
              ).at(-1);
              return boundary ? `event-${boundary.id}` : 'initial';
            }

            const marker = (id) => `<!-- actrium-issue-language:reminder:v1:${id} -->`;
            async function existingReminder(issueNumber, id) {
              const comments = await github.paginate(api.listComments, { ...params(issueNumber), per_page: 100 });
              return comments.filter((comment) => fromBot(comment.user) &&
                (comment.body ?? '').split('\n').includes(marker(id)) &&
                Number.isFinite(Date.parse(comment.created_at))
              ).reduce((first, comment) => !first || Date.parse(comment.created_at) < Date.parse(first.created_at) ? comment : first, null);
            }

            async function ensureLabel() {
              try {
                await api.getLabel({ ...repo, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await api.createLabel({ ...repo, name: label, color: 'FBCA04',
                    description: 'Please write the issue title and description in English.' });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                  await api.getLabel({ ...repo, name: label });
                }
              }
            }

            async function handleIssue(issueNumber) {
              const issue = await getIssue(issueNumber);
              if (!isOpenIssue(issue)) return;
              if (!hasHan(issue)) {
                if (hasLabel(issue)) {
                  try {
                    await api.removeLabel({ ...params(issueNumber), name: label });
                  } catch (error) {
                    if (error.status !== 404) throw error;
                  }
                }
                return;
              }

              if (!hasLabel(issue)) {
                await ensureLabel();
                await api.addLabels({ ...params(issueNumber), labels: [label] });
              }
              const id = await episode(issueNumber);
              if (await existingReminder(issueNumber, id)) return;
              const live = await getIssue(issueNumber);
              if (!isOpenIssue(live) || !hasHan(live) || !hasLabel(live)) return;
              const login = live.user?.login ?? '';
              const lead = /^[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})$/.test(login) ? `@${login}, please` : 'Please';
              const deadline = new Date(Date.now() + graceMs)
                .toISOString().slice(0, 19).replace('T', ' ') + ' UTC';
              await api.createComment({ ...params(issueNumber), body: `${marker(id)}\n${lead} edit the issue title and description to use English by ${deadline}. If the issue still contains Han characters after the deadline, it will be closed.` });
            }

            async function closeIfExpired(issueNumber) {
              const issue = await getIssue(issueNumber);
              if (!isOpenIssue(issue) || !hasLabel(issue) || !hasHan(issue)) return;
              const id = await episode(issueNumber);
              const reminder = await existingReminder(issueNumber, id);
              if (!reminder || Date.now() - Date.parse(reminder.created_at) < graceMs) return;
              if (await episode(issueNumber) !== id) return;
              // Check live metadata as the last read before requesting closure.
              const live = await getIssue(issueNumber);
              if (!isOpenIssue(live) || !hasLabel(live) || !hasHan(live)) return;
              await api.update({ ...params(issueNumber), state: 'closed', state_reason: 'not_planned' });
              await api.createComment({ ...params(issueNumber), body: 'Closing this issue because the title or description still contains Han characters at least seven days after the English-language reminder.' });
            }

            if (context.eventName === 'issues') {
              await handleIssue(context.payload.issue.number);
            } else if (context.eventName === 'schedule') {
              // Read every page before closing anything so mutations cannot shift page boundaries.
              const candidates = await github.paginate(api.listForRepo, { ...repo, state: 'open', labels: label, per_page: 100 });
              for (const issue of candidates.filter(isOpenIssue)) {
                try {
                  await closeIfExpired(issue.number);
                } catch (error) {
                  core.setFailed(`Issue #${issue.number}: language check failed (HTTP ${error.status ?? 'unknown'}).`);
                }
              }
            }
