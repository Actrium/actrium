name: Keel CI

on:
  push:
    branches: [main]
    paths:
      - "packages/keel/**"
      - "keel/**"
      - "contracts/sandbox/**"
      - "crates/keel-native-guest/**"
      - "examples/keel/**"
      - ".github/workflows/keel-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/keel/**"
      - "keel/**"
      - "contracts/sandbox/**"
      - "crates/keel-native-guest/**"
      - "examples/keel/**"
      - ".github/workflows/keel-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: packages/keel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # This repository carries two lockfiles. bun.lock is the one that installs
      # (guarded by --frozen-lockfile above); package-lock.json installs nothing
      # and exists only so Dependabot can resolve the dependency graph and raise
      # security alerts. Because nothing consumes it, it can silently go stale --
      # a package.json edit that refreshes only bun.lock leaves the graph, and
      # therefore every alert derived from it, describing a tree we do not ship.
      # `npm ls` validates the lock against package.json without rewriting it,
      # so it cannot fail on npm-version formatting differences.
      - name: Check package-lock.json matches package.json
        run: npm ls --package-lock-only --all

      - name: Run preflight
        run: bun run preflight

      - name: Run guest bundle tests
        run: bun run test:bundle

      - name: Run native tests
        run: bun run test:native

      - name: Install Playwright browsers
        run: bun x playwright install --with-deps chromium

      - name: Run WASM sandbox E2E
        run: bun run test:e2e:wasm

      # Source and prose here are English (issue #166). preflight already runs
      # this, so on a passing build the step is a no-op repeat -- it earns its
      # place through `if: always()`. A language violation is exactly the kind
      # of thing that slips in alongside an unrelated failure, and without this
      # the report would be buried behind whichever earlier step went red.
      - name: Check source is English-only
        if: always()
        run: bun run check:cjk

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # examples/keel/guests/rust is the native (non-JS) WASM guest workspace.
    # The .wasm fixtures under packages/keel/src/host/native-guest are committed to
    # git and are NOT compared here (wasm output is not byte-reproducible
    # across toolchains): after changing the guests, rebuild them manually with
    # examples/keel/guests/rust/build.sh. This job keeps the sources green.
    defaults:
      run:
        working-directory: examples/keel/guests/rust

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Install pinned Clippy toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --target wasm32-unknown-unknown --no-self-update

      - name: Lint (clippy, wasm target)
        # Explicit selection takes precedence over the fixture toolchain file.
        env:
          CARGO_BUILD_WARNINGS: deny
        run: cargo +1.97.1 clippy --workspace --target wasm32-unknown-unknown

      - name: Build WASM guests
        run: cargo build --workspace --target wasm32-unknown-unknown --release

      # The DWARF debug branch of build.sh names crates explicitly (GUESTS),
      # so a rename in the workspace can break it while --workspace above stays
      # green. Build it for real so the list can never drift again.
      - name: Build debug (DWARF) WASM guests
        run: KEEL_GUEST_DEBUG=1 bash build.sh

      # Host-target unit tests for the SDK crate: wire codecs (op-batch / canvas /
      # KBS1 golden vectors), the contract conformance suite, and the host-call
      # wrapper wiretaps. `-p keel-native-guest` rather than --workspace on purpose: the
      # guest cdylibs around it are wasm32-only (their panic handler uses
      # core::arch::wasm32, which collides with std's in a test harness), so a
      # workspace-wide `cargo test` cannot compile. Both feature configurations
      # run — `binary-protocol` is default-on and gates real code paths (e.g. the
      # canvas encoding fork in canvas::draw), so the JSON-only build needs its
      # own pass to stay green.
      - name: Test SDK crate (host target)
        working-directory: ${{ github.workspace }}
        run: |
          cargo test -p keel-native-guest
          cargo test -p keel-native-guest --no-default-features

  # Windows-only native code that nothing else compiles: the MSVC source patches
  # for QuickJS (compound literals, __builtin_frame_address, the infinity
  # constant), the force-included compat header, and msvc-shims/ standing in for
  # pthread.h and sys/time.h. Until this job existed the only thing exercising
  # any of it was a human running examples/keel/windows-demo/dev.cmd, which is how a
  # compile break survived from the demo landing until someone happened to build
  # on Windows (issue #168).
  #
  # This is the build-and-typecheck half of issue #173, not the behaviour half.
  # An end-to-end run needs a generated RNW project, MSIX packaging components
  # and Developer Mode on the runner; the two gates here are what turns "nobody
  # has compiled this in months" into a per-PR signal, and they stand on their
  # own if the e2e half never happens.
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: examples/keel/windows-demo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # npm, not bun: this demo is a react-native-windows app and its toolchain
      # (the RNW CLI, the autolinking targets, NuGet restore) reads
      # package-lock.json. The demo's typecheck is self-contained -- everything
      # the linked keel sources need resolves inside this directory -- so the
      # repository root does not have to be installed for the step below.
      - name: Install demo dependencies
        run: npm ci

      - name: Typecheck the demo
        run: npm run typecheck

      # The sandbox library needs Microsoft.ReactNative.Cxx (and, for the Hermes
      # engine, Microsoft.JavaScript.Hermes) unpacked under ~/.nuget/packages:
      # CMakeLists.txt globs them from there rather than taking a path.
      - name: Restore NuGet packages
        run: msbuild windows\WindowsDemo.sln /t:Restore /p:Platform=x64 /p:Configuration=Release /nologo /v:m

      # Both engines, because they compile different sources: quickjs pulls in
      # the patched vendor C, hermes pulls in the N-API adapter. A green build of
      # one says nothing about the other.
      #
      # These cover the C++ side of issue #168 as well, which is not obvious:
      # the target is not C-only. QuickJSSandboxJSI.h includes <quickjs.h> and is
      # compiled as C++ here, against the patched header CMake writes into the
      # binary dir -- so a patch that stops applying breaks this job. What it
      # cannot cover is the OTHER consumer, WindowsDemo.vcxproj, whose include
      # order can silently reach the unpatched vendor header; that one is
      # asserted at build time by the EnsureKeelSandboxNative target in the
      # .vcxproj, because reproducing it here would mean running Metro and the
      # MSIX packaging chain for one header check.
      # No -G: the runner image is not a fixed Visual Studio. windows-latest is
      # windows-2025-vs2026 as of this writing, so pinning "Visual Studio 17 2022"
      # fails with "could not find any instance of Visual Studio" -- and pinning
      # 2026 instead only moves the breakage to the next image bump. CMake's
      # default generator on Windows is the newest installed VS, which is what we
      # actually want; -A x64 still pins the architecture.
      - name: Build the sandbox library (QuickJS)
        run: |
          cmake -S windows\KeelSandboxNative -B windows\KeelSandboxNative\build -A x64 -DKEEL_SANDBOX_ENGINE=quickjs
          cmake --build windows\KeelSandboxNative\build --config Release

      - name: Build the sandbox library (Hermes)
        run: |
          cmake -S windows\KeelSandboxNative -B windows\KeelSandboxNative\build-hermes -A x64 -DKEEL_SANDBOX_ENGINE=hermes
          cmake --build windows\KeelSandboxNative\build-hermes --config Release
